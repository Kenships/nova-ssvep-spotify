# Scripted "attention" sequence for a rehearsed/backup demo run.
# Each step sets the simulator's attended frequency for duration_sec.
# freq_hz: null means idle (noise only, no target attended).
#
# This walks through: pick "Energetic" mood -> playlist starts -> transport
# layer -> Next -> Play/Pause -> back to Mood layer.
steps:
  - freq_hz: null
    duration_sec: 2.0
  - freq_hz: 18.0       # Mood layer: Energetic
    duration_sec: 3.0
  - freq_hz: null
    duration_sec: 1.5
  - freq_hz: 16.5       # Transport layer: Next
    duration_sec: 3.0
  - freq_hz: null
    duration_sec: 1.5
  - freq_hz: 15.0       # Transport layer: Play/Pause
    duration_sec: 3.0
  - freq_hz: null
    duration_sec: 1.5
  - freq_hz: 19.5       # Transport layer: Back to Mood
    duration_sec: 3.0
