[pytest]
# Covers the standalone scripts that support the backend/LSL pipeline but
# live outside backend/app (which has its own pytest.ini + 100% line
# coverage gate) -- the simulator and the WS smoke-test client. Run from the
# repo root: `backend\.venv\Scripts\python -m pytest`.
testpaths = scripts simulator
addopts = --cov=smoke_test_ws_client --cov=mock_eeg_lsl --cov=recorded_session_replay --cov-report=term-missing --cov-fail-under=100
